{{- if .Values.grafanaDashboard.enabled }}
# Picked up by the Grafana sidecar of kube-prometheus-stack (label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "slotsync.fullname" . }}-dashboard
  labels:
    {{- include "slotsync.labels" . | nindent 4 }}
    {{- toYaml .Values.grafanaDashboard.labels | nindent 4 }}
data:
  slotsync.json: |-
{{ .Files.Get "dashboards/slotsync.json" | indent 4 }}
{{- end }}
