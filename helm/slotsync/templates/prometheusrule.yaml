{{- if .Values.prometheusRule.enabled }}
{{- $ns := .Release.Namespace }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "slotsync.fullname" . }}
  labels:
    {{- include "slotsync.labels" . | nindent 4 }}
    {{- toYaml .Values.prometheusRule.labels | nindent 4 }}
spec:
  groups:
    - name: slotsync.rules
      rules:
        - alert: SlotSyncBackendDown
          expr: sum(up{namespace="{{ $ns }}", service=~".*backend"}) == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: No SlotSync backend pod is being scraped successfully.
        - alert: SlotSyncHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ $ns }}", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="{{ $ns }}"}[5m])), 1e-9) > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: More than 5% of SlotSync API requests are failing with 5xx.
        - alert: SlotSyncSlowRequests
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_highr_seconds_bucket{namespace="{{ $ns }}"}[5m]))) > 0.5
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: SlotSync API p95 latency is above 500ms.
{{- end }}
