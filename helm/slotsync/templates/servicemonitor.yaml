{{- if .Values.serviceMonitor.enabled }}
# Tells the Prometheus Operator to scrape every backend pod's /metrics.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "slotsync.fullname" . }}-backend
  labels:
    {{- include "slotsync.labels" . | nindent 4 }}
    {{- toYaml .Values.serviceMonitor.labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "slotsync.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
