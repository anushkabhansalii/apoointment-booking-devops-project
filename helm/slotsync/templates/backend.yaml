{{- $component := dict "ctx" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slotsync.fullname" . }}-backend
  labels:
    {{- include "slotsync.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: {{ include "slotsync.tag" (dict "image" .Values.backend.image "ctx" .) | quote }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "slotsync.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slotsync.selectorLabels" $component | nindent 8 }}
        slotsync/db-access: "true"
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "slotsync.selectorLabels" $component | nindent 14 }}
      containers:
        - name: backend
          image: {{ include "slotsync.image" (dict "image" .Values.backend.image "ctx" .) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "slotsync.fullname" . }}-backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "slotsync.dbSecretName" . }}
                  key: DATABASE_URL
          # Migrations run in the entrypoint; give them time before liveness kicks in.
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "slotsync.fullname" . }}-backend
  labels:
    {{- include "slotsync.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "slotsync.selectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
