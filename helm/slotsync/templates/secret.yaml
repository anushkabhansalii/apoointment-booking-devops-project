{{- if not .Values.database.existingSecret }}
{{- /*
  Generate the database password once and keep it: on upgrade, reuse the value
  already stored in the cluster so the running PostgreSQL keeps working.
*/}}
{{- $name := include "slotsync.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data }}
{{- $password = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- $url := .Values.database.externalUrl | default (printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username $password (include "slotsync.postgresHost" .) .Values.postgres.database) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "slotsync.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ $url | quote }}
{{- end }}
