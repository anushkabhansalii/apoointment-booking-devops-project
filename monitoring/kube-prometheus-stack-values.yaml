# Values for prometheus-community/kube-prometheus-stack.
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml

# Managed control planes (EKS) and minikube don't expose these components to
# scrapers; disabling them keeps the Targets page free of permanent DOWN noise.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PrometheusRules from every namespace, not only
    # those carrying this Helm release's label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 3d
    scrapeInterval: 15s
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1536Mi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }

grafana:
  # The admin password is NOT stored in Git: scripts/install-monitoring.sh
  # creates the grafana-admin Secret with a random password first.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  # Grafana is only reachable through kubectl port-forward (ClusterIP), so
  # dashboards are viewable read-only without logging in; editing still
  # requires the admin password from the grafana-admin Secret.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/slotsync.json
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
